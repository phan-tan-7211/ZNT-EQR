<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b63ce" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

    <!-- Apply the saved choice/system preference before the first paint. -->
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('znteqr-theme');
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Mark app routes before the first paint so a stale/static marketing document cannot flash on dashboard F5. -->
    <script>
      (() => {
        const pathname = window.location.pathname;
        const appRoutePrefixes = ['/dashboard', '/auth', '/invitation', '/qr', '/e', '/debug-'];
        const isAppRoute = appRoutePrefixes.some((prefix) =>
          pathname === prefix || pathname.startsWith(prefix + '/')
        );
        if (isAppRoute) {
          document.documentElement.dataset.appRoute = 'true';
        }
      })();
    </script>

    <!-- Returning authenticated browsers may briefly request "/" before auth resolves.
         Hide prerendered marketing copy before first paint when a persisted Supabase
         auth session is present, then let React decide whether to continue to the
         dashboard or show the public landing page after auth validation. -->
    <script>
      (() => {
        try {
          const hasPersistedAuth = Object.keys(localStorage).some((key) => {
            if (!key.startsWith('sb-') || !key.endsWith('-auth-token')) return false;
            const value = localStorage.getItem(key);
            return Boolean(value && value !== 'null' && value !== 'undefined');
          });
          if (hasPersistedAuth) {
            document.documentElement.dataset.authBoot = 'true';
          }
        } catch {
          // Storage may be unavailable in hardened/private browser modes.
        }
      })();
    </script>

    <title>ZNTEQR | Equipment Management & Maintenance</title>
    <meta name="description" content="ZNTEQR is a QR-based equipment management and maintenance application for equipment records, work orders, preventive maintenance, teams and inventory." />
    <meta name="author" content="Phan Tan" />
    <link rel="canonical" href="https://placeholder.invalid/" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Supabase connection hints -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <meta property="og:title" content="ZNTEQR | Equipment Management & Maintenance" />
    <meta property="og:description" content="QR-based equipment management, maintenance, work orders and inventory in one application." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://placeholder.invalid/" />
    <meta property="og:image" content="https://eqr.zinitek.com/images/brand/icons/ZNTEQR-Icon-512.png" />
    <meta property="og:image:alt" content="ZNTEQR equipment management logo" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZNTEQR | Equipment Management & Maintenance" />
    <meta name="twitter:description" content="QR-based equipment management, maintenance, work orders and inventory in one application." />
    <meta name="twitter:image" content="https://eqr.zinitek.com/images/brand/icons/ZNTEQR-Icon-512.png" />

    <style>
      html, body {
        min-height: 100%;
        background: #f8fafc;
        color: #0f172a;
      }

      html.dark, html.dark body {
        background: #0a0a0a;
        color: #fafafa;
      }

      body {
        margin: 0;
      }

      #root {
        min-height: 100vh;
      }

      /* Keep a stable branded shell visible while React/auth chunks boot. */
      #app-boot-loading {
        display: none;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html.dark #app-boot-loading {
        background: #0a0a0a;
        color: #fafafa;
      }

      html[data-app-route] #app-boot-loading,
      html[data-auth-boot] #app-boot-loading {
        display: flex;
      }

      /* If a host serves a marketing HTML file for an app URL, or a returning
         authenticated browser requests "/", hide prerendered copy immediately. */
      html[data-app-route] #root > [data-prerendered-marketing-route],
      html[data-auth-boot] #root > [data-prerendered-marketing-route] {
        display: none !important;
      }

      .app-boot-mark {
        width: 2.75rem;
        height: 2.75rem;
        border: 3px solid rgba(11, 99, 206, 0.2);
        border-top-color: #0b63ce;
        border-radius: 9999px;
        animation: app-boot-spin 0.8s linear infinite;
      }

      .app-boot-brand {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .app-boot-label {
        margin: 0;
        font-size: 0.875rem;
        color: #64748b;
      }

      html.dark .app-boot-label {
        color: #94a3b8;
      }

      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ZNTEQR",
      "description": "QR-based equipment management and maintenance application for equipment records, work orders, preventive maintenance, teams and inventory.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web"
    }
    </script>
  </head>

  <body>
    <noscript>
      <div style="font-family:system-ui,sans-serif;max-width:42rem;margin:2rem auto;padding:0 1rem;line-height:1.5;color:#fafafa;background:#0a0a0a;">
        <p><strong>ZNTEQR</strong> requires JavaScript for the full application.</p>
        <p>ZNTEQR provides QR-based equipment management, maintenance history, work orders and inventory.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <div id="app-boot-loading" role="status" aria-live="polite" aria-label="Loading ZNTEQR workspace">
      <div class="app-boot-mark" aria-hidden="true"></div>
      <div class="app-boot-brand">ZNTEQR</div>
      <p class="app-boot-label">Loading workspace…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
